server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
  flyway:
    clean-on-validation-error: false
    clean-disabled: false
bot:
  name: ${BOT_NAME}
  token: ${BOT_TOKEN}
  chat: ${BOT_CHAT}
  thread: ${BOT_THREAD}
  api: https://api.telegram.org/
  hook: https://transceivers.ninja/
management:
  endpoints:
    web:
      exposure:
        include: "health,info,scheduledtasks,loggers,metrics"
  endpoint:
    health:
      show-details: always
    scheduledtasks:
      enabled: true
